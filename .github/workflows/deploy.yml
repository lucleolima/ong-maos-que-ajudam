# Integração e entrega contínuas (CI/CD) com GitHub Actions.
# - Em todo pull request para develop ou main: testes + build + auditoria de acessibilidade.
# - Em todo push na main (merge de release ou hotfix): o mesmo e, se tudo passar,
#   publica a pasta dist/ no GitHub Pages. Se algum teste falhar, nada é publicado.

name: Testes e deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# Evita dois deploys ao mesmo tempo; um novo push cancela o que estava esperando
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes de unidade
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Acessibilidade (axe-core no Chrome headless, pasta dist/)
        run: npm run test:a11y:dist

      - name: Enviar dist/ para o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
